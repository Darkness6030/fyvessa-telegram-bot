{% from "_product_card.html" import product_card %}
{% if products %}
<div class="grid grid-cols-2 gap-x-3 gap-y-8 sm:grid-cols-3 lg:grid-cols-5">
    {% for product in products %}{{ product_card(product, categories_by_id.get(product.category_id), is_new) }}{% endfor %}
</div>
{% else %}
<div class="rounded-[2rem] border border-dashed border-black/20 p-12 text-center">
    <p class="text-3xl">♡</p><h2 class="mt-3 text-xl font-black">Здесь пока пусто</h2>
    <a href="/catalog" class="mt-5 inline-flex rounded-full bg-ink px-5 py-3 font-bold text-white">В каталог</a>
</div>
{% endif %}
