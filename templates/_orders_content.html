{% if orders %}
<div class="space-y-3">
  {% for order in orders %}
  <a href="/orders/{{ order.id }}" class="flex items-center justify-between rounded-[1.5rem] bg-white p-5 shadow-soft">
    <div><p class="text-xs font-bold uppercase tracking-wider text-black/40">{{ order.created_at.strftime('%d.%m.%Y') }}</p><h2 class="mt-1 font-black">{{ order.number }}</h2><p class="mt-1 text-sm text-black/55">{{ status_labels.get(order.status, order.status) }}</p></div>
    <div class="text-right"><strong class="text-xl">{{ "%.0f"|format(order.paid_total) }} ₽</strong><p class="mt-1 text-black/30">→</p></div>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="rounded-[2rem] border border-dashed border-black/20 p-12 text-center"><p class="text-4xl">📦</p><h2 class="mt-3 text-xl font-black">Заказов пока нет</h2><a href="/catalog" class="mt-5 inline-flex rounded-full bg-ink px-5 py-3 font-bold text-white">В каталог</a></div>
{% endif %}
